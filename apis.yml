aid: supercede
name: Supercede
description: >-
  Supercede is a London-based reinsurance intelligence platform that helps cedents (insurers)
  and reinsurance brokers manage complex reinsurance data, placements, and deals. Its
  AI-supported software consolidates deals, layers, and placements across brokers into unified
  programme views for cedents ("Placement Intelligence"), and gives brokers a "Client Workspace"
  to prepare, standardize, and share client data with the market. The platform emphasizes
  vendor-neutral integration with existing systems and ISO 27001-aligned data security. Supercede
  is backed by Seedcamp and operates as a closed B2B SaaS product; no public developer/API surface
  is published at the time of this profile.
